# Called by release-please.yml after a release PR is merged: builds the module and attaches its jar to the GitHub Release that
# Release Please just created. "Run workflow" with dry_run builds without attaching; give it an existing tag to re-attach a jar.
name: Release plugin
on:
  workflow_call:
    inputs:
      module: { type: string, required: true }
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      module:
        description: Module to build
        type: choice
        options: [core, market, bank, dashboard, trade]
        default: core
      tag:
        description: Existing release tag to attach the jar to (empty for a build-only run)
        type: string
        default: ""
      dry_run:
        description: Build only, attach nothing
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODULE: ${{ inputs.module }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: The release must be on main and match the module version
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse --short HEAD) is not on main"; exit 1; }
          version=$(tr -d '[:space:]' < "$MODULE/version.txt")
          if [ -n "$TAG" ]; then
            [ "$TAG" = "$MODULE-v$version" ] || { echo "::error::tag $TAG but $MODULE/version.txt says $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ATTACH=${{ inputs.tag != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - name: Dry run summary
        if: env.ATTACH != 'true'
        run: ls -la "$MODULE"/build/libs/
      - name: Attach the jar to the GitHub Release
        if: env.ATTACH == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" "$MODULE"/build/libs/*.jar --clobber
