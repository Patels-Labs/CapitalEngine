# Called by release-please.yml after the api release PR is merged. It builds and tests, writes the binaries into the PUBLIC repo
# (patelheet30/capitalengine-api) on a release/api-<version> branch, and that repo opens a PR. Merging that PR is the approval;
# GitHub Pages then serves it. "Run workflow" with dry_run=true does everything except push.
name: Release API
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (empty for a build-only run)
        type: string
        default: ""
      dry_run:
        description: Build and stage only, push nothing
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_REPO: patelheet30/capitalengine-api
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Must come from main, and the tag must match api/version.txt
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::not on main"; exit 1; }
          declared=$(tr -d '[:space:]' < api/version.txt)
          if [ -n "$TAG" ]; then
            [ "$TAG" = "api-v$declared" ] || { echo "::error::tag $TAG but api/version.txt says $declared"; exit 1; }
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"
          echo "DRY=${{ inputs.tag == '' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test everything (ApiContractTest guards the contract)
        run: ./gradlew build
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PUBLIC_REPO }}
          ssh-key: ${{ secrets.API_REPO_DEPLOY_KEY }}
          path: site
      - name: Stage the binaries
        run: |
          dir="site/m2/com/patelheet/capitalengine-api/$VERSION"
          [ ! -e "$dir" ] || { echo "::error::$VERSION is already published. Published versions are immutable: bump the version instead."; exit 1; }
          ./gradlew :api:publish -PcapitalRepoUrl="file://$PWD/site/m2"
          mkdir -p "site/docs/$VERSION"
          cp -r api/build/docs/javadoc/. "site/docs/$VERSION/"
          rm -rf site/docs/latest && mkdir -p site/docs/latest && cp -r api/build/docs/javadoc/. site/docs/latest/
      - name: Binaries only, never source
        run: |
          bad=$(find site -path site/.git -prune -o -type f \( -name '*.java' -o -name '*.kt' -o -name '*.kts' -o -name '*.sql' -o -name '*.class' \) -print; find site -path site/.git -prune -o -type d -name 'src-html' -print)
          [ -z "$bad" ] || { echo "::error::source-like files in the public repo:"; echo "$bad"; exit 1; }
      - name: Push the release branch
        if: env.DRY != 'true'
        working-directory: site
        run: |
          git config user.name "capitalengine-release-bot"; git config user.email "noreply@patelheet.com"
          git checkout -b "release/api-$VERSION"
          git add -A
          git commit -m "API $VERSION"
          git push origin "release/api-$VERSION"
      - name: Dry run summary
        if: env.DRY == 'true'
        working-directory: site
        run: git status --short | head -50
      - name: Attach the jar to the GitHub Release
        if: env.DRY != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" api/build/libs/*.jar --clobber
