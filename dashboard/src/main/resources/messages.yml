label-issuedToday: "Created today"
label-destroyedToday: "Destroyed today"
label-treasuryInToday: "Into the Treasury today"
label-treasuryOutToday: "Out of the Treasury today"
label-activePlayersToday: "Active players today"
label-activeMinutesToday: "Active minutes today"
label-avgActivePlayers7d: "Active players (7-day average)"
label-flow-issued: "<plugin>: created today"
label-flow-destroyed: "<plugin>: destroyed today"
label-flow-treasuryIn: "<plugin>: into the Treasury today"
label-flow-treasuryOut: "<plugin>: out of the Treasury today"
