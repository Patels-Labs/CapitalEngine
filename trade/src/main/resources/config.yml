# CapitalTrade. Coin amounts are written like in CapitalEngine ("1.5", "20"). Items are listed in exports.yml and imports.yml.

storage:
  type: sqlite            # sqlite | mysql | mariadb | postgres
  file: trade.db          # sqlite only
  # host: localhost       # mysql / mariadb / postgres
  # port: 3306
  # database: capitaltrade
  # user: ""
  # password: ""
  # prefix: trade_        # table name prefix for mysql/postgres, so a database can be shared
  # pool-size: 4

world-prices:             # each item's world price wanders a little every day and is pulled back toward its base
  theta: 0.10             # how strongly it is pulled back
  sigma: 0.05             # how much it wanders
  min-x: 0.5              # never below half the base price
  max-x: 2.0              # never above twice the base price
  seed: 12345

exports:
  slide-k: 0.5            # the price falls as the day's quota fills: at a full quota it is half
  daily-budget: 5000      # coins exports may create per day (CapitalEngine's issue-per-day for CapitalTrade is the hard limit)

imports:
  slide-k: 0.5            # the price rises as the day's quota fills: at a full quota it is 1.5 times

booms:                    # once a week, faraway lands may want one export item more
  chance: 0.5
  multiplier: 1.3

ports:
  radius: 8               # /trade works within this many blocks of a Port
  anywhere: false         # true: /trade works everywhere (suits small kid servers)
