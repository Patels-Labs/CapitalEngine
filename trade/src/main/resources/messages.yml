# Every player-facing string. MiniMessage formatting. Chat lines carry the prefix; menu text does not.
prefix: "<dark_aqua>[Port]</dark_aqua> "

# ---- chat: errors and guidance ------------------------------------------------------------------------------------
no-item: "<red>Hold the item you wish to sell.</red>"
cant-trade: "<red>The ships only take plain items: custom names, lore and damaged items are not accepted.</red>"
not-wanted: "<red>Faraway lands do not buy <item>. Open the Port to see what they want.</red>"
bad-number: "<red>Please enter a whole number greater than zero.</red>"
not-enough-items: "<red>You hold only <have> <item> in your inventory.</red>"
need-port: "<red>You need to be at a Port to trade with faraway lands. Ask staff where the nearest Port is.</red>"
nothing-to-confirm: "<red>There is nothing to confirm.</red>"
no-permission: "<red>You do not have permission to do that.</red>"
help: "<gray>Unknown or incomplete command. Type <white>/trade help</white> for guidance, or <white>/trade help commands</white> for the full list.</gray>"
admin-help: "<gray>/trade admin port create [name] | port remove &lt;name&gt; | port list | boom &lt;item&gt; [multiplier] | reload</gray>"
reloaded: "<green>Messages, exports.yml and imports.yml reloaded. Other settings require a restart.</green>"
export-quota: "<red>The ships are full of that item for today! Try again tomorrow, or sell it to other players.</red>"
export-budget: "<red>The ships have spent all their coins for today! Try again tomorrow, or sell to other players.</red>"
export-unknown: "<red>Faraway lands do not buy that item.</red>"
export-limited-quota: "<yellow>The ships can take only <qty> of the <wanted> today.</yellow>"
export-limited-budget: "<yellow>The ships have coins left for only <qty> of the <wanted> today.</yellow>"
import-off: "<red>This server does not import anything from abroad.</red>"
import-unknown: "<red>That item is not brought in from abroad. Open the Port to see what is.</red>"
import-quota: "<red>No more of that item arrives today. Try again tomorrow.</red>"
import-limited: "<yellow>Only <qty> of the <wanted> can arrive today.</yellow>"
too-expensive: "<red>The price has changed to <total>. Please try again.</red>"
err-funds: "<red>You do not have enough coins.</red>"
err-full: "<red>The ships are full for today! Try again tomorrow, or sell to other players.</red>"
err-paused: "<red>The Port is closed for a moment. Your items have been returned; please try again soon.</red>"
err-slow: "<yellow>The ships are taking longer than usual. Your coins or items will arrive soon; check <white>/trade cargo</white> in a little while.</yellow>"
err-other: "<red>The request could not be completed. Nothing was taken; please try again.</red>"

# ---- chat: confirmations and results ------------------------------------------------------------------------------
confirm-export: "<yellow>Sell <qty> <item> to faraway lands for <total>? The items will be shipped away. Type <white>/trade yes</white> to confirm.</yellow>"
confirm-import: "<yellow>Buy <qty> <item> from abroad for <total> (including <tariff> import tax)? Type <white>/trade yes</white> to confirm.</yellow>"
exported: "<green>Shipped <qty> <item> to faraway lands for <total>.</green>"
imported: "<green>Bought <qty> <item> from abroad for <total>.</green>"
cargo-collected: "<green>Collected <qty> items from your Cargo.</green>"
cargo-full: "<yellow>Your inventory is full, so <qty> items are waiting in your Cargo. Collect them at any Port with <white>/trade cargo</white>.</yellow>"
cargo-empty: "<gray>Your Cargo is empty.</gray>"

