# ---- in-game help: /trade help [topic] ---------------------------------------------------------------------------
# Keep these in step with trade/docs/player-guide.md. Figures are the defaults; servers may change them.
help-overview: "<dark_aqua><bold>Port Help</bold></dark_aqua><newline><gray>At a Port you sell everyday goods to faraway lands, and sometimes buy items your world does not have. Choose a topic:</gray>"
help-topics: "<click:run_command:/trade help start><yellow>[Getting Started]</yellow></click> <click:run_command:/trade help export><yellow>[Selling]</yellow></click> <click:run_command:/trade help import><yellow>[Buying]</yellow></click> <click:run_command:/trade help prices><yellow>[Prices]</yellow></click> <click:run_command:/trade help news><yellow>[Port News]</yellow></click> <click:run_command:/trade help cargo><yellow>[Cargo]</yellow></click> <click:run_command:/trade help commands><yellow>[Commands]</yellow></click>"
help-typed: "<gray>Or type <white>/trade help &lt;topic&gt;</white>: start, export, import, prices, news, cargo, commands.</gray>"
help-unknown: "<red>There is no help topic called \"<topic>\".</red>"
help-start: "<dark_aqua><bold>Getting Started</bold></dark_aqua><newline><gray>A Port is a barrel with a floating <white>⚓ Port</white> sign, or a Port keeper. Right-click it, or type <white>/trade</white> within 8 blocks of one.<newline>Every sale and purchase is confirmed first, and your balance never goes below zero.</gray>"
help-export: "<dark_aqua><bold>Selling to Faraway Lands</bold></dark_aqua><newline><gray>Open <white>Sell to Faraway Lands</white>, pick an item and choose how many. The items are shipped away and the coins are yours.<newline>The ships take only so much of each item a day, more when more players are online. Prices fall as the ships fill up, and once they are full, try again tomorrow or sell to other players.<newline>Command: <white>/trade sell [amount|all]</white> sells the item in your hand.</gray>"
help-import: "<dark_aqua><bold>Buying from Abroad</bold></dark_aqua><newline><gray>Some servers bring in items their world does not have. If yours does, open <white>Buy from Abroad</white>. The price includes an import tax that goes to the server; the rest is paid to faraway lands.<newline>Only a few arrive each day, and the price rises as more are bought.<newline>Command: <white>/trade buy &lt;item&gt; &lt;amount&gt;</white></gray>"
help-prices: "<dark_aqua><bold>Prices</bold></dark_aqua><newline><gray>Every item has a world price that moves a little each day, shown with ▲ or ▼. It never goes below half or above twice its usual price.<newline>Ships pay less than players usually do, so selling to other players is often the better deal.</gray>"
help-news: "<dark_aqua><bold>Port News</bold></dark_aqua><newline><gray>Some weeks, faraway lands want one item more and pay extra for it. Port News announces it in chat and on the Port's <white>Port News</white> button.<newline>Command: <white>/trade news</white></gray>"
help-cargo: "<dark_aqua><bold>Cargo</bold></dark_aqua><newline><gray>Items that do not fit in your inventory wait in your Cargo: things you bought from abroad, and anything the ships could not take. Collect them at any Port.<newline>Command: <white>/trade cargo</white></gray>"
help-commands: "<dark_aqua><bold>Commands</bold></dark_aqua><newline><gray><white>/trade</white> Port menu | <white>sell [amount|all]</white> | <white>buy &lt;item&gt; &lt;amount&gt;</white> | <white>cargo</white> | <white>news</white> | <white>yes</white> | <white>help [topic]</white></gray>"
