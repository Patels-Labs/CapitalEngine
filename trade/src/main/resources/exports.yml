# What faraway lands buy at a Port. base: the world price in coins (it wanders between half and twice this).
# quota-per-active-player: how many the ships take each day for every player active today, so a quiet server can't print money.
# Bases are kept below usual Market prices, so selling to other players stays the better deal most of the time.
# Only plain items are accepted: no custom names or lore, full durability. This file is yours; upgrades never change it.
