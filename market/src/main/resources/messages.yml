# Every player-facing string. MiniMessage formatting. Chat lines carry the prefix; menu text does not.
prefix: "<gold>[Market]</gold> "

# ---- chat: errors and guidance ------------------------------------------------------------------------------------
no-item: "<red>Hold the item you wish to use.</red>"
cant-trade: "<red>This item cannot be traded: custom names, lore and damaged items are not accepted.</red>"
unknown-item: "<red>No item matches \"<item>\".</red>"
bad-number: "<red>Please enter a whole number greater than zero.</red>"
bad-price: "<red>Please enter a price such as 12 or 1.5.</red>"
not-enough-items: "<red>You hold only <have> <item> in your inventory and Stash.</red>"
stash-full: "<red>Your Stash is full. Sell or withdraw items first.</red>"
need-stall: "<red>Items can only be withdrawn from the Stash at a market stall.</red>"
too-many-orders: "<red>You have reached the maximum number of open orders. Cancel one first.</red>"
sell-no-buyers: "<red>There are currently no buyers for this item.</red>"
sell-budget: "<red>The market has reached its purchasing budget for today and cannot buy this item. You may list it for other players, or try again after the daily reset.</red>"
sell-daily-limit: "<red>The market has reached its daily purchasing limit for this item. You may list it for other players, or try again tomorrow.</red>"
sell-limited-budget: "<yellow>The market can buy only <qty> of the <wanted> requested today (daily purchasing budget). The remainder may be listed for other players.</yellow>"
sell-limited-daily-limit: "<yellow>The market can buy only <qty> of the <wanted> requested today (daily limit for this item). The remainder may be listed for other players.</yellow>"
sell-limited-no-buyers: "<yellow>Only <qty> of the <wanted> requested have buyers at present.</yellow>"
buy-no-stock: "<red>This item is currently out of stock. Check Player Listings or try again later.</red>"
buy-limited: "<yellow>Only <qty> of the <wanted> requested are available.</yellow>"
too-expensive: "<red>The price has changed to <total>. Please try again.</red>"
nothing-to-confirm: "<red>There is nothing to confirm.</red>"
err-funds: "You do not have sufficient funds."
err-limit: "The market cannot buy more of this item today. Consider listing it for other players."
err-paused: "The market is temporarily unavailable."
err-other: "The request could not be completed. No funds were taken; please try again."

# ---- chat: confirmations and results ------------------------------------------------------------------------------
confirm-sell: "<yellow>Sell <qty> <item> for <total>? Type <white>/market yes</white> to confirm.</yellow>"
confirm-buy: "<yellow>Buy <qty> <item> for <total>? Type <white>/market yes</white> to confirm.</yellow>"
confirm-wanted: "<yellow>Place a wanted order for <qty> <item> at <price> each? Up to <total> will be held until it is filled. Type <white>/market yes</white> to confirm.</yellow>"
confirm-job: "<yellow>Post a job for <qty> <item> at <pay> each? <total> will be held until it is completed. Type <white>/market yes</white> to confirm.</yellow>"
confirm-build: "<yellow>Post the build job \"<note>\" paying <pay>? The payment will be held until it is completed. Type <white>/market yes</white> to confirm.</yellow>"
sold: "<green>Sold <qty> <item> for <total>.</green>"
bought: "<green>Purchased <qty> <item> for <total>. Withdraw it from your Stash with <white>/market take <item></white>.</green>"
partly: "<yellow>Completed <qty> of <wanted>. <reason></yellow>"
listed: "<green>Listed <qty> <item> at <price> each (order #<id>).</green>"
wanted: "<green>Wanted order placed for <qty> <item> at <price> each (order #<id>).</green>"
cancelled: "<green>Order #<id> cancelled. Your items or funds have been returned.</green>"
cant-cancel: "<red>You have no open order #<id>.</red>"
taken: "<green>Withdrew <qty> <item> to your inventory.</green>"
nothing-taken: "<red>There is nothing to withdraw.</red>"
stash-header: "<gold>Stash:</gold>"
stash-line: "<gray>- <item>: <qty> (<locked> listed for sale)</gray>"
stash-empty: "<gray>Your Stash is empty.</gray>"
orders-header: "<gold>Open orders:</gold>"
orders-line: "<gray>#<id> <side> <left> <item> at <price> each</gray>"
orders-empty: "<gray>You have no open orders.</gray>"
price-line: "<gold><item></gold> <gray>- buy</gray> <white><ask></white><gray>, sell</gray> <white><bid></white> <gray>(<trend>, stock <stock>)</gray>"
