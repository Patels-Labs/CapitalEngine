stall-no-space: "<red>A market stall needs three clear blocks above the block you are looking at.</red>"
stall-already: "<red>A market stall already exists here.</red>"
stall-not-a-stall: "<red>The block you are looking at is not a market stall barrel.</red>"
stall-protected: "<red>This market stall can only be removed by an administrator using /market admin stall remove.</red>"
stall-hologram: "<gold><bold>Market Stall</bold></gold><newline><gray>Right-click the barrel to trade</gray>"
project-none: "<gray>There are no projects.</gray>"
project-line: "<gray><name>: <needs></gray>"

