search-none: "<red>No items match \"<query>\".</red>"
help: "<gold>/market</gold> <gray>opens the market. Commands: sell [quantity|all] | buy &lt;item&gt; &lt;quantity&gt; | list &lt;quantity&gt; &lt;price&gt; | wanted &lt;item&gt; &lt;quantity&gt; &lt;price&gt; | orders | cancel &lt;id&gt; | stash | take &lt;item&gt; [quantity] | price [item]</gray>"
reloaded: "<green>Messages, prices and projects reloaded. Other settings require a restart.</green>"
admin-done: "<green>Done.</green>"
escrow-ok: "<green>Escrow balances are correct.</green>"
escrow-bad: "<red>Escrow mismatch: the market holds <held> and orders require <need>; jobs hold <jheld> and require <jneed>.</red>"

