# Every player-facing line. MiniMessage format. <placeholders> are filled in by the plugin.
no-permission: "<red>You can't do that.</red>"
unknown-player: "<red>I don't know a player called <name>.</red>"
starter: "<green>Welcome! Here are <amount> to get you started.</green>"

memo:
  starter: "Welcome! Here are some coins to get you started"
  pay: "<from> paid <to>"
  vault-deposit: "Reward from <plugin>"
  vault-withdraw: "Paid to <plugin>"
  give: "Given by an admin"
  take: "Taken by an admin"
  import: "Opening balance from <provider>"

money:
  balance-other: "<gold><name> has <white><amount></white>.</gold>"
  console-usage: "<red>Please name a player: /money <player></red>"

gui:
  title: "Your coins"
  balance: "<gold>You have <amount></gold>"
  history-in: "<green>+<amount></green> <gray>· <memo></gray>"
  history-out: "<red>-<amount></red> <gray>· <memo></gray>"
  history-empty: "<gray>Nothing has happened with your coins yet</gray>"
  pay-button: "<aqua>Pay a friend</aqua>"
  pay-hint: "<yellow>To pay a friend, type <white>/pay <name> <amount></white> in chat.</yellow>"

pay:
  console: "<red>Only players can pay.</red>"
  usage: "<yellow>Pay a friend: <white>/pay <player> <amount></white></yellow>"
  self: "<red>You can't pay yourself.</red>"
  invalid-amount: "<red>That doesn't look like an amount. Try 50, or 1.5k.</red>"
  too-small: "<red>The smallest payment is <min>.</red>"
  not-enough: "<red>You don't have enough. You have <balance>.</red>"
  confirm: "<yellow>Pay <name> <amount>?</yellow> <click:run_command:'/pay confirm'><green>[✔ Yes]</green></click> <click:run_command:'/pay cancel'><red>[✖ No]</red></click>"
  form-title: "Pay <name>?"
  form-content: "Pay <name> <amount>?"
  form-yes: "Yes, pay"
  form-no: "No, cancel"
  confirm-typed: "<gray>Or type <white>/pay confirm</white> to pay, or <white>/pay cancel</white> to stop. This ends in 30 seconds.</gray>"
  nothing-pending: "<red>There's no payment waiting. Start with /pay <player> <amount>.</red>"
  expired: "<red>That took too long, so the payment was cancelled. Try again.</red>"
  cancelled: "<yellow>Payment cancelled. Nothing was paid.</yellow>"
  sent: "<green>You paid <name> <amount>.</green>"
  received: "<green><name> paid you <amount>!</green>"
  failed: "<red>The payment didn't go through: <reason></red>"
  failed-funds: "You don't have enough."

ce:
  help: "<gold>CapitalEngine:</gold> <white>/ce audit | reverse | give | take | import | policy | check | reload | prune</white>"
  unlimited: "no limit"
  audit-usage: "<yellow>/ce audit player <name> [page] · plugin <name> [days] · tx <id> · top [days]</yellow>"
  reverse-usage: "<yellow>/ce reverse <tx> [reason]</yellow>"
  give-usage: "<yellow>/ce give <player> <amount> [reason]</yellow>"
  take-usage: "<yellow>/ce take <player> <amount> [reason]</yellow>"
  import-usage: "<yellow>/ce import <economy plugin> [--dry-run]. Economy plugins I can see: <found></yellow>"
  policy-usage: "<yellow>/ce policy [plugin] · /ce policy set <plugin> <vault-mode|issue-per-day|treasury-per-day> <value></yellow>"
  policy-line: "<gold><plugin></gold> <gray>mode <white><mode></white> · creates up to <white><issue></white>/day (<white><issue-left></white> left today) · Treasury up to <white><treasury></white>/day (<white><treasury-left></white> left today)</gray>"
  policy-set: "<green>Set <plugin> <key> to <value>.</green>"
  bad-value: "That isn't a valid value for <key>."
  failed: "<red>That didn't work: <reason></red>"
  gave: "<green>Gave <name> <amount> (transaction #<id>).</green>"
  took: "<green>Took <amount> from <name> (transaction #<id>).</green>"
  reversed: "<green>Transaction #<id> undone by #<by>.</green>"
  reverse-failed: "<red>Couldn't undo #<id>: <reason></red>"
  check-running: "<gray>Checking the books...</gray>"
  check-ok: "<green>The books balance.</green>"
  check-bad: "<red>The self-check found <count> problem(s):</red>"
  check-problem: "<red> - <problem></red>"
  reloaded: "<green>Reloaded. (Currency names and decimals change only after a restart.)</green>"
  pruned: "<green>Old activity and daily numbers removed. The ledger itself is never pruned.</green>"

audit:
  error: "<red>Couldn't read the ledger: <error></red>"
  empty: "<gray>Nothing found.</gray>"
  line: "<gray>#<id></gray> <amount> <white><memo></white> <dark_gray>[<type> · <plugin>]</dark_gray>"
  player-header: "<gold>Latest coin movements for <name> (page <page>)</gold>"
  plugin-header: "<gold><name> over the last <days> day(s)</gold>"
  plugin-flows: "<gray>created <white><issued></white> · destroyed <white><destroyed></white> · into Treasury <white><tin></white> · out of Treasury <white><tout></white> · net created <white><net></white></gray>"
  tx-not-found: "<red>There is no transaction #<id>.</red>"
  tx-header: "<gold>Transaction #<id>: <type></gold> <gray>by <plugin>, <time></gray>"
  tx-memo: "<gray>Memo:</gray> <white><memo></white>"
  tx-posting: "<gray>  <account>: <amount></gray>"
  tx-reference: "<gray>Reference: <reference></gray>"
  tx-reverses: "<yellow>This undoes #<id>.</yellow>"
  tx-reversed: "<red>Undone by #<id>.</red>"
  top-header: "<gold>Plugins by net money created, last <days> day(s)</gold>"
  top-line: "<gray><rank>.</gray> <white><name></white> <gray>net <net>, created <issued>, destroyed <destroyed></gray>"

import:
  no-provider: "<red>I can't see an economy plugin called <name>. Keep the old one installed while importing. Economy plugins I can see: <found></red>"
  dry-run: "<yellow>Dry run: <count> balances (<total> in all) would be imported. Skipped <skipped> odd ones and <zero> empty ones.</yellow>"
  done: "<green>Imported <count> balances (<total> in all). <already> were already imported, <skipped> odd ones skipped, <zero> empty ones ignored.</green>"
  next-steps: "<yellow>Now remove or disable the old economy plugin. If /bal still opens the old one, alias it to CapitalEngine in commands.yml.</yellow>"
