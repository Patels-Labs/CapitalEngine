# Every player-facing string. MiniMessage formatting. Chat lines carry the prefix; menu text does not.
# Keep each top-level entry on one line, so an upgrade can add new entries to an edited file unchanged.
prefix: "<gold>[Bank]</gold> "

# ---- chat: errors and guidance ------------------------------------------------------------------------------------
err-funds: "<red>You do not have enough coins.</red>"
err-savings: "<red>You do not have that much in savings.</red>"
err-limit: "<red>The bank cannot do that today. Please try again tomorrow.</red>"
err-paused: "<red>The bank is having a nap. Please try again in a minute!</red>"
err-other: "<red>That did not work. No coins were taken; please try again.</red>"
bad-amount: "<red>Please enter an amount of coins, such as 50 or 1.5.</red>"
no-permission: "<red>You do not have permission to do that.</red>"
unknown-command: "<gray>Unknown command. Type <white>/bank help</white> for guidance.</gray>"
usage-deposit: "<gray>Type <white>/bank deposit &lt;amount&gt;</white> or <white>/bank deposit all</white>.</gray>"
usage-withdraw: "<gray>Type <white>/bank withdraw &lt;amount&gt;</white> or <white>/bank withdraw all</white>.</gray>"
unknown-player: "<red>No player called <name> has played here.</red>"
nothing-to-confirm: "<red>There is nothing to confirm.</red>"
cancelled: "<gray>Cancelled. Nothing was changed.</gray>"
prompt-amount: "<yellow>Type the number of coins in chat, for example 50.</yellow>"
prompt-cancel: "<gray>Type <white>cancel</white> to stop.</gray>"
prompt-cancelled: "<gray>Cancelled.</gray>"

