# ---- in-game help: /bank help [topic] -----------------------------------------------------------------------------
# Keep these in step with bank/docs/player-guide.md. Figures are the defaults; servers may change them.
help-overview: "<gold><bold>Bank Help</bold></gold><newline><gray>The bank keeps your savings safe and adds a little interest every day. You can also borrow coins and pay them back over a few days. If you own a large piece of land, the bank collects a small daily upkeep for it. Choose a topic:</gray>"
help-topics: "<click:run_command:/bank help start><yellow>[Getting Started]</yellow></click> <click:run_command:/bank help savings><yellow>[Savings]</yellow></click> <click:run_command:/bank help loans><yellow>[Loans]</yellow></click> <click:run_command:/bank help upkeep><yellow>[Land Upkeep]</yellow></click> <click:run_command:/bank help commands><yellow>[Commands]</yellow></click>"
help-typed: "<gray>Or type <white>/bank help &lt;topic&gt;</white>: start, savings, loans, upkeep, commands.</gray>"
help-unknown: "<red>There is no help topic called \"<topic>\".</red>"
help-start: "<gold><bold>Getting Started</bold></gold><newline><gray>Type <white>/bank</white> to open the bank. It has three buttons: <white>Savings</white>, <white>Loan</white> and <white>Land Upkeep</white>.<newline>Anything that costs coins asks you to confirm first, and the bank never takes you below zero.</gray>"
help-savings: "<gold><bold>Savings</bold></gold><newline><gray>Coins you put into savings earn interest every day (shown as a rate a week, such as 2% a week). The interest is added to your savings, so it grows over time.<newline>Interest is paid on the first 10,000 coins. You can take your savings out at any time, and no other plugin or player can touch them.</gray>"
help-loans: "<gold><bold>Loans</bold></gold><newline><gray>You can have one loan at a time. You choose an amount up to your limit (500 coins to start), and a small part is paid back each day for 7 days. The confirmation shows exactly what you will pay.<newline>If you cannot pay one day, nothing bad happens: the amount is taken when you next have coins, and you cannot borrow again until you have caught up. Paying back on time raises your limit. You need 2 hours of playtime before your first loan.</gray>"
help-upkeep: "<gold><bold>Land Upkeep</bold></gold><newline><gray>The first 10,000 blocks² of land you claim (100 by 100) are free. Above that, land costs 1 coin a day for every 100 blocks², collected automatically from your coins.<newline>If more than 3 days of upkeep is owed, your land is frozen: you and your trusted friends cannot build, break or open chests there until it is paid. Nothing is ever deleted, and it unfreezes as soon as the upkeep is paid. Upkeep stops while you are away for more than 14 days.</gray>"
help-commands: "<gold><bold>Commands</bold></gold><newline><gray><white>/bank</white> menu | <white>deposit &lt;amount|all&gt;</white> | <white>withdraw &lt;amount|all&gt;</white> | <white>loan [amount]</white> | <white>repay [amount|all]</white> | <white>upkeep</white> | <white>yes</white> confirms | <white>help [topic]</white></gray>"

